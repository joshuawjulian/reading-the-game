format:
  html:
    theme:
      light: [cosmo, assets/custom.scss, assets/light.scss]
      dark: [darkly, assets/custom.scss, assets/dark.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-summary: "Show the Python"
    fig-format: svg
    fig-align: center
    callout-appearance: default
    filters:
      - filters/pdf-link.lua
    comments:
      giscus:
        repo: joshuawjulian/reading-the-game
        repo-id: "R_kgDOU93kPg"
        category: "Announcements"
        category-id: "DIC_kwDOU93kPs4DHKAy"
        mapping: pathname
        reactions-enabled: true
        loading: lazy
        theme:
          light: light
          dark: dark_dimmed

execute:
  echo: true
  warning: false
  freeze: auto
