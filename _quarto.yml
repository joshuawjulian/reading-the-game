project:
  type: book
  output-dir: _site
  resources:
    - pdfs/*.pdf

book:
  title: "Reading the Game"
  subtitle: "Football from the couch to the coordinator's booth"
  author: "Joshua Julian"
  repo-url: https://github.com/joshuawjulian/reading-the-game
  site-url: https://joshuawjulian.github.io/reading-the-game/
  repo-actions: [issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    # CHAPTERS-BEGIN (generated by scripts/gen_toc.py from planning/chapters.yml)
    # CHAPTERS-END
  appendices:
    - appendices/glossary.qmd
    - appendices/pdfs.qmd

format:
  html:
    theme:
      light: [cosmo, assets/custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-summary: "Show the Python"
    fig-format: svg
    fig-align: center
    callout-appearance: default
    filters:
      - filters/pdf-link.lua

execute:
  echo: true
  warning: false
  freeze: false
