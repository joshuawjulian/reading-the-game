project:
  type: book
  output-dir: _site
  resources:
    - pdfs/*.pdf

book:
  title: "Reading the Game"
  subtitle: "Football from the couch to the coordinator's booth"
  author: "Joshua Julian"
  repo-url: https://github.com/joshuawjulian/reading-the-game
  site-url: https://joshuawjulian.github.io/reading-the-game/
  repo-actions: [issue, source]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    # CHAPTERS-BEGIN (generated by scripts/gen_toc.py from planning/chapters.yml)
    - part: "Part 1: Foundations"
      chapters:
        - chapters/01-foundations/01-04-what-a-play-really-is.qmd
    - part: "Part 3: The Run Game"
      chapters:
        - chapters/03-the-run-game/03-02-zone-running.qmd
    - part: "Part 6: Pass Coverage"
      chapters:
        - chapters/06-pass-coverage/06-06-disguise-rotation-and-split-field.qmd
    - part: "Part 13: Analytics and Data"
      chapters:
        - chapters/13-analytics-and-data/13-02-expected-points-and-success-rate.qmd
    # CHAPTERS-END
  appendices:
    - appendices/glossary.qmd
    - appendices/pdfs.qmd

format:
  html:
    theme:
      light: [cosmo, assets/custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-summary: "Show the Python"
    fig-format: svg
    fig-align: center
    callout-appearance: default
    filters:
      - filters/pdf-link.lua
    comments:
      giscus:
        repo: joshuawjulian/reading-the-game
        repo-id: "R_kgDOU93kPg"
        category: "Announcements"
        category-id: "DIC_kwDOU93kPs4DHKAy"
        mapping: pathname
        reactions-enabled: true
        loading: lazy
        theme: light

execute:
  echo: true
  warning: false
  freeze: false
