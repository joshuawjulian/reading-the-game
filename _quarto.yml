book:
  title: "Reading the Game"
  subtitle: "Football from the couch to the coordinator's booth"
  author: "Joshua Julian"
  repo-url: https://github.com/joshuawjulian/reading-the-game
  site-url: https://joshuawjulian.github.io/reading-the-game/
  repo-actions: [issue, source]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - progress.qmd
    # CHAPTERS-BEGIN (generated by scripts/gen_toc.py from planning/chapters.yml)
    - part: "Part 1: Foundations"
      chapters:
        - chapters/01-foundations/01-01-the-game-in-fifteen-minutes.qmd
        - chapters/01-foundations/01-02-downs-distance-and-field-position.qmd
        - chapters/01-foundations/01-03-the-twenty-two.qmd
        - chapters/01-foundations/01-04-what-a-play-really-is.qmd
        - chapters/01-foundations/01-05-the-pre-snap-phase.qmd
        - chapters/01-foundations/01-06-how-to-watch-a-broadcast.qmd
    - part: "Part 2: Personnel and Formations"
      chapters:
        - chapters/02-personnel-and-formations/02-01-personnel-groupings.qmd
        - chapters/02-personnel-and-formations/02-02-formation-rules-and-vocabulary.qmd
        - chapters/02-personnel-and-formations/02-03-classic-formations.qmd
        - chapters/02-personnel-and-formations/02-04-spread-and-modern-formations.qmd
        - chapters/02-personnel-and-formations/02-05-a-first-look-at-defense.qmd
        - chapters/02-personnel-and-formations/02-06-motion-and-shifts.qmd
    - part: "Part 3: The Run Game"
      chapters:
        - chapters/03-the-run-game/03-01-run-game-language.qmd
        - chapters/03-the-run-game/03-02-zone-running.qmd
        - chapters/03-the-run-game/03-03-gap-and-power-runs.qmd
        - chapters/03-the-run-game/03-04-option-football.qmd
        - chapters/03-the-run-game/03-05-perimeter-and-misdirection.qmd
    - part: "Part 4: The Passing Game"
      chapters:
        - chapters/04-the-passing-game/04-01-passing-fundamentals.qmd
        - chapters/04-the-passing-game/04-02-pass-protection.qmd
        - chapters/04-the-passing-game/04-03-quick-game.qmd
        - chapters/04-the-passing-game/04-08-offensive-systems-and-languages.qmd
    - part: "Part 5: Defensive Fronts and Run Defense"
      chapters:
        - chapters/05-defensive-fronts-and-run-defense/05-01-dl-techniques-and-gap-control.qmd
    - part: "Part 6: Pass Coverage"
      chapters:
        - chapters/06-pass-coverage/06-06-disguise-rotation-and-split-field.qmd
    - part: "Part 13: Analytics and Data"
      chapters:
        - chapters/13-analytics-and-data/13-02-expected-points-and-success-rate.qmd
    # CHAPTERS-END
  appendices:
    - appendices/glossary.qmd
    - appendices/pdfs.qmd

format:
  html:
    theme:
      light: [cosmo, assets/custom.scss, assets/light.scss]
      dark: [darkly, assets/custom.scss, assets/dark.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-summary: "Show the Python"
    fig-format: svg
    fig-align: center
    callout-appearance: default
    filters:
      - filters/pdf-link.lua
    comments:
      giscus:
        repo: joshuawjulian/reading-the-game
        repo-id: "R_kgDOU93kPg"
        category: "Announcements"
        category-id: "DIC_kwDOU93kPs4DHKAy"
        mapping: pathname
        reactions-enabled: true
        loading: lazy
        theme:
          light: light
          dark: dark_dimmed

execute:
  echo: true
  warning: false
  freeze: auto
