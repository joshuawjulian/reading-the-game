[project]
name = "gridiron"
version = "0.1.0"
description = "Play diagrams and animations in NFL Big Data Bowl tracking coordinates, for the Reading the Game course."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10",
    "jupyter>=1.1",
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=16",
    "pypdf>=5",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridiron"]
