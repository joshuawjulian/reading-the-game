name: Wrong or outdated fact
description: A date, rule, stat, attribution or team example that's incorrect or out of date
labels: [feedback, fact-check]
body:
  - type: input
    id: chapter
    attributes: { label: Chapter (title or URL) }
    validations: { required: true }
  - type: textarea
    id: claim
    attributes: { label: What does it say?, description: Quote the sentence if you can. }
    validations: { required: true }
  - type: textarea
    id: correction
    attributes: { label: What's right, and how do you know?, description: A source link helps a lot. }
