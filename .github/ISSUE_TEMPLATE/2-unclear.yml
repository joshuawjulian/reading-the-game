name: Confusing or unclear
description: Something didn't click, used a term before explaining it, or skipped a step
labels: [feedback, clarity]
body:
  - type: input
    id: chapter
    attributes: { label: Chapter (title or URL) }
    validations: { required: true }
  - type: textarea
    id: where
    attributes: { label: Which part?, description: Section heading or a quote. }
    validations: { required: true }
  - type: textarea
    id: confusion
    attributes: { label: What confused you?, description: "e.g. 'I didn't know what a 3-technique was yet.'" }
    validations: { required: true }
