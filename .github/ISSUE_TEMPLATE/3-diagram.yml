name: Diagram problem
description: A play diagram or animation is wrong, cluttered or hard to read
labels: [feedback, diagram]
body:
  - type: input
    id: chapter
    attributes: { label: Chapter (title or URL) }
    validations: { required: true }
  - type: input
    id: figure
    attributes: { label: Which figure?, description: Its caption or number. }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: What's wrong? }
    validations: { required: true }
