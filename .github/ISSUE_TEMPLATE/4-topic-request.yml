name: Topic request
description: Something you want explained that the course doesn't cover (or covers too thinly)
labels: [feedback, topic-request]
body:
  - type: textarea
    id: topic
    attributes: { label: What do you want explained?, description: "e.g. 'Why do teams run so much 12 personnel now?' or 'What was the Wing-T?'" }
    validations: { required: true }
  - type: textarea
    id: context
    attributes: { label: Where did it come up?, description: A game, broadcast moment, article or chapter. }
